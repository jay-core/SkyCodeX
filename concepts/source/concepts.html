<!doctype html>
<html><head><meta charset="utf-8"><title>Moss concepts</title>
<style>
:root{
  --bg:#00240A; --side:#001C08; --term:#001506; --pop:#00300E; --card:#002A0C; --prev:#001F09; --line:#0A3A18;
  --fg:#d9dcd6; --dim:#6b7d70; --gut:#3f5a46; --kw:#77a5a5; --fn:#d8ba7b; --ty:#86b98a; --var:#c8a8b8; --par:#d97969; --str:#d4a574;
  --err:#d97969; --warn:#d4a574; --stage:#050906;
  --mono:ui-monospace,"SF Mono",Menlo,monospace; --ui:-apple-system,system-ui,"Segoe UI",sans-serif;
}
html,body{margin:0;background:var(--stage)}
*{box-sizing:border-box}
.frame{width:1440px;height:900px;padding:24px 28px 26px;display:flex;flex-direction:column;gap:14px;font-family:var(--ui);color:var(--fg);
  background:radial-gradient(1200px 700px at 30% 20%,#0a1a0e 0%,#050906 70%)}
.ttl{display:flex;align-items:baseline;gap:14px;height:30px;flex:none}
.ttl .no{font:600 12px var(--mono);color:var(--kw);letter-spacing:.12em}
.ttl h1{margin:0;font:600 22px var(--ui);letter-spacing:-.01em}
.ttl p{margin:0;color:#8d9a8f;font-size:14px}
.ttl .brand{margin-left:auto;font:600 11px var(--ui);letter-spacing:.2em;color:#2f4d38}
.stage{flex:1;min-height:0;position:relative;display:flex;gap:20px}
.notes{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:12px;height:96px;flex:none}
.note{background:#09120b;border:1px solid #12251a;border-radius:9px;padding:9px 12px;font-size:12.2px;line-height:1.4;color:#a9b4a8;overflow:hidden}
.big .code{font-size:14px;line-height:24px}
.big .ln .g{width:50px}
.note b{color:var(--fg);font-weight:600}
.pin{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--fn);color:#00240A;font:700 10px var(--ui);
  vertical-align:1px;margin:0 6px 0 4px;box-shadow:0 0 0 3px rgba(216,186,123,.2);flex:none;font-style:normal;text-decoration:none;line-height:1}
.note .pin{margin:0 6px 0 0}
.label{font:600 11px var(--ui);color:#7d8c80;letter-spacing:.12em;text-transform:uppercase;margin:0 0 8px 2px;display:flex;align-items:center;gap:6px}
.col{display:flex;flex-direction:column;min-width:0;min-height:0}

/* window */
.win{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg);border-radius:10px;overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px #0d3318}
.hdr{height:30px;flex:none;display:flex;align-items:center;padding:0 12px;background:var(--side);border-bottom:1px solid var(--line);font:12px var(--ui);color:var(--dim);position:relative;z-index:2}
.crumb{display:flex;align-items:center;white-space:nowrap}
.crumb .dir{color:var(--dim)} .crumb .file{color:var(--fg)} .crumb .sep{margin:0 8px;color:var(--gut)} .crumb .fnn{color:var(--fn);font-family:var(--mono);font-size:11.5px}
.crumb .mod{width:6px;height:6px;border-radius:50%;background:var(--ty);margin-left:8px;display:inline-block}
.hdr .right{margin-left:auto;display:flex;gap:16px;align-items:center;font:11px var(--mono);white-space:nowrap}
.hdr .ok{color:var(--ty)} .hdr .wa{color:var(--warn)} .hdr .er{color:var(--err)}
.dots{display:flex;gap:6px;margin-right:12px}
.dots i{width:8px;height:8px;border-radius:50%;display:block;background:#173a22}
.dots.on i:nth-child(1){background:#d97969}.dots.on i:nth-child(2){background:#d4a574}.dots.on i:nth-child(3){background:#86b98a}
.wctl{display:flex;margin:0 -12px 0 14px;height:29px}
.wctl span{width:32px;display:grid;place-items:center;color:var(--dim);font-size:11px}
.wctl span.hov{background:#b9584b;color:#efeae2}
.body{flex:1;min-height:0;display:grid}
.pane{min-width:0;min-height:0;overflow:hidden;border-right:1px solid var(--line);position:relative;display:flex;flex-direction:column}
.pane:last-child{border-right:0}
.pane.files{background:var(--side)}
.pane.prev{background:var(--prev)}
.ph{height:26px;flex:none;display:flex;align-items:center;padding:0 10px;font:600 10px var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--dim);gap:6px;white-space:nowrap}
.ph .grow{flex:1}
.chip{white-space:nowrap;font:500 10.5px var(--ui);padding:2px 7px;border-radius:9px;border:1px solid #17432a;color:var(--dim);text-transform:none;letter-spacing:0}
.chip.on{color:var(--fg);background:rgba(119,165,165,.14);border-color:rgba(119,165,165,.45)}
.pbody{flex:1;min-height:0;position:relative;overflow:hidden}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:#3c5a45;font:12px/1.5 var(--ui);text-align:center;padding:24px}
.links{position:absolute;left:0;top:0;pointer-events:none;z-index:6;overflow:visible}

/* code */
.code{font-family:var(--mono);font-size:12.5px;line-height:20px;padding:8px 0;white-space:pre}
.ln{display:flex;position:relative}
.ln .g{width:44px;flex:none;text-align:right;padding-right:14px;color:var(--gut);position:relative;user-select:none}
.ln.act{background:rgba(119,165,165,.075)}
.ln.act .g{color:var(--kw)}
.ln .t{flex:1;min-width:0}
.ln.dimmed .t{opacity:.36}
.k{color:var(--kw)} .f{color:var(--fn)} .y{color:var(--ty)} .v{color:var(--var)} .p{color:var(--par);font-style:italic} .s{color:var(--str)}
.n{color:var(--var)} .cm{color:var(--dim);font-style:italic} .pp{color:var(--kw)} .ns{color:var(--fg)} .mac{color:var(--kw)}
.e{text-decoration:underline wavy var(--err) 1px;text-underline-offset:4px}
.w{text-decoration:underline dotted var(--warn) 2px;text-underline-offset:4px}
.i{text-decoration:underline dotted var(--kw) 2px;text-underline-offset:4px}
.cur{display:inline-block;width:2px;height:16px;background:var(--kw);vertical-align:-3px;margin:0 -1px;box-shadow:0 0 6px rgba(119,165,165,.7)}
.sel{background:rgba(119,165,165,.33)}
.occ{background:rgba(119,165,165,.22);border-radius:2px}
.u{text-decoration:underline var(--kw) 1px;text-underline-offset:4px}
.hint{font:500 10.5px var(--ui);color:#86a28d;background:rgba(119,165,165,.12);border-radius:4px;padding:1px 5px;margin:0 3px 0 1px;font-style:normal}
.eol{font:italic 11.5px var(--ui);margin-left:24px;opacity:.85}
.eol.er{color:var(--err)} .eol.wa{color:var(--warn)} .eol.in{color:var(--kw)}
.tag{font:500 9.5px var(--ui);padding:0 5px;border-radius:3px;border:1px solid currentColor;opacity:.8;margin-left:6px;font-style:normal}
.ln.hitl{background:rgba(119,165,165,.16)}
.ln.del{background:rgba(217,121,105,.12)} .ln.add{background:rgba(134,185,138,.12)}
.ln.del .g,.ln.add .g{font-weight:600}
.ln.del .g{color:var(--err)} .ln.add .g{color:var(--ty)}
.ln.g2 .g{box-shadow:inset -3px 0 var(--fn)} .ln.g3 .g{box-shadow:inset -3px 0 var(--ty)} .ln.g4 .g{box-shadow:inset -3px 0 var(--var)} .ln.g5 .g{box-shadow:inset -3px 0 var(--kw)}
.gd{position:absolute;left:8px;top:6px;width:8px;height:8px;border-radius:50%}

/* cards */
.cards{padding:4px 8px 8px 20px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:7px;overflow:hidden;flex:none}
.card.focus{border-color:rgba(119,165,165,.65);box-shadow:0 0 0 3px rgba(119,165,165,.09)}
.card-h{display:flex;align-items:center;gap:7px;padding:4px 9px;height:26px;font:11.5px var(--mono);border-bottom:1px solid var(--line);background:rgba(0,0,0,.14);white-space:nowrap}
.card.collapsed .card-h{border-bottom:0}
.card-h .nm{color:var(--fn)}
.card-h .loc{margin-left:auto;color:var(--dim);font:10.5px var(--ui)}
.card-h .sw{width:7px;height:7px;border-radius:50%;flex:none;background:var(--dim)}
.card .code{font-size:11.5px;line-height:18px;padding:4px 0}
.card .ln .g{width:34px;padding-right:10px}
.badge{font:500 10px var(--ui);padding:1px 7px;border-radius:9px;background:rgba(119,165,165,.15);color:var(--kw)}
.badge.warm{background:rgba(212,165,116,.14);color:var(--str)}
.badge.pink{background:rgba(200,168,184,.14);color:var(--var)}
.rows{padding:4px 0;font:11.5px var(--mono)}
.row{display:flex;gap:8px;padding:3px 10px;color:#b7c0b5;white-space:nowrap}
.row .loc{margin-left:auto;color:var(--dim);font:10.5px var(--ui)}
.row.on{background:rgba(119,165,165,.12);color:var(--fg)}
.cnote{font:11.5px/1.5 var(--ui);color:#94a395;padding:6px 10px}

/* tree */
.tree{font:12px var(--ui);padding:2px 0}
.ti{display:flex;align-items:center;gap:6px;height:22px;padding-right:12px;color:#aab3a9;white-space:nowrap}
.ti .ic{width:10px;color:var(--dim);font-size:9px;flex:none}
.ti.act{background:rgba(119,165,165,.16);color:var(--fg);box-shadow:inset 2px 0 var(--kw)}
.ti.mod .nm{color:var(--kw)} .ti.dim .nm{color:var(--dim)} .ti.new .nm{color:var(--ty)}
.ti .fds{margin-left:auto;display:flex;gap:3px}
.ti .fd{width:7px;height:7px;border-radius:50%}

/* terminal */
.term{display:flex;flex-direction:column;background:var(--term);border-top:1px solid var(--line);flex:none;position:relative}
.tt{height:26px;flex:none;display:flex;align-items:center;gap:18px;padding:0 12px;font:11px var(--ui);color:var(--dim)}
.tt .on{color:var(--fg);box-shadow:0 1px 0 var(--kw);padding-bottom:3px}
.tt .grow{flex:1}
.term .code{font-size:12px;line-height:18px;padding:2px 2px}
.okc{color:var(--ty)} .tlink{color:var(--kw);text-decoration:underline;text-underline-offset:3px} .er{color:var(--err)} .wa{color:var(--warn)} .dm{color:var(--dim)}

/* floating */
.pop{position:absolute;z-index:8;background:var(--pop);border:1px solid #1f4d2c;border-radius:8px;box-shadow:0 16px 40px rgba(0,0,0,.55);font:12px var(--ui);color:var(--fg)}
.kbd{display:inline-block;font:500 11px var(--ui);padding:1px 6px;border-radius:4px;border:1px solid #2b5a38;border-bottom-width:2px;background:#00300e;color:var(--fg);margin:0 2px}
.toast{position:absolute;z-index:9;right:16px;bottom:16px;background:var(--pop);border:1px solid #1f4d2c;border-left:3px solid var(--warn);border-radius:7px;padding:10px 14px;font:12px/1.5 var(--ui);box-shadow:0 16px 40px rgba(0,0,0,.5);max-width:420px}
.ruler{position:absolute;right:0;top:0;bottom:0;width:8px;background:rgba(0,0,0,.12);z-index:3}
.ruler i{position:absolute;left:1px;right:1px;height:3px;border-radius:1px}
</style></head>
<body><div id="root"></div>
<script>
window.onerror=(m,s,l,c)=>{window.__err=m+' @'+l+':'+c;};
const R=String.raw;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const sp=(c,t)=>`<span class="${c}">${esc(t)}</span>`;
const KW=new Set(`auto bool break case char class const constexpr continue default delete do double else enum explicit extern false float for if inline int long namespace new noexcept nullptr operator private protected public return short signed sizeof static static_assert struct switch template this throw true try typedef typename union unsigned using virtual void volatile while override final size_t uint8_t uint16_t uint32_t uint64_t int64_t`.split(/\s+/));
const NS=new Set(['std','tiny']);
const TYPES=new Set(['string_view','string','vector','optional','span','function','sv']);

function hlCpp(s,o,after){
  const inc=s.match(/^(\s*#\s*(?:include|pragma))(.*)$/); if(inc) return sp('pp',inc[1])+sp(/include/.test(inc[1])?'s':'pp',inc[2]);
  const re=/(\/\/.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(\b\d[\w.]*)|([A-Za-z_]\w*)/g;
  let out='',last=0,m;
  while((m=re.exec(s))){out+=esc(s.slice(last,m.index));last=re.lastIndex;const t=m[0];
    if(m[1])out+=sp('cm',t);else if(m[2])out+=sp('s',t);else if(m[3])out+=sp('n',t);
    else{const rest=s.slice(last)+after;let c;
      if(KW.has(t))c='k';
      else if(o.params&&o.params.includes(t))c='p';
      else if(/^[A-Z][A-Z0-9_]+$/.test(t))c='mac';
      else if(/^\s*\(/.test(rest))c='f';
      else if(NS.has(t))c='ns';
      else if(/^[A-Z]/.test(t)||TYPES.has(t))c='y';
      else c='v';
      out+=sp(c,t);}}
  return out+esc(s.slice(last));}
function hlTomlVal(v){
  const m=v.match(/^("(?:[^"\\]|\\.)*"|[^#]*?)(\s*)(#.*)?$/);if(!m)return esc(v);
  const val=m[1];let o;
  if(/^"/.test(val))o=sp('s',val);else if(/^(true|false)$/.test(val.trim()))o=sp('k',val);else if(/^[\d.\-]+$/.test(val.trim()))o=sp('n',val);else o=esc(val);
  return o+esc(m[2]||'')+(m[3]?sp('cm',m[3]):'');}
function hlToml(s){let m;
  if(/^\s*#/.test(s))return sp('cm',s);
  if((m=s.match(/^(\s*)(\[[^\]]+\])(.*)$/))){const r=m[3],i=r.indexOf('#');return esc(m[1])+sp('y',m[2])+(i<0?esc(r):esc(r.slice(0,i))+sp('cm',r.slice(i)));}
  if((m=s.match(/^(\s*)([\w.]+)(\s*=\s*)(.*)$/)))return esc(m[1])+sp('f',m[2])+esc(m[3])+hlTomlVal(m[4]);
  if(/^\d+$/.test(s.trim()))return sp('n',s);
  return esc(s);}
const REG=/^(r[a-d]x|e[a-d]x|r[sd]i|e[sd]i|r[sb]p|e[sb]p|r\d+d?|xmm\d+|[a-d]l)$/;
function hlAsm(s){const ci=s.indexOf(';');const code=ci<0?s:s.slice(0,ci),cm=ci<0?'':s.slice(ci);
  if(/^\S/.test(code))return sp('f',code)+(cm?sp('cm',cm):'');
  let first=true;
  const out=code.replace(/[A-Za-z_.][\w.]*|\d+|[^\w.]+/g,t=>{
    if(/^[^\w.]+$/.test(t))return esc(t);
    if(first&&/^[a-z]/.test(t)){first=false;return sp('k',t);}
    if(REG.test(t))return sp('v',t); if(/^\d/.test(t))return sp('n',t); if(/^\./.test(t))return sp('f',t);
    if(/^(dword|qword|ptr|byte|word)$/.test(t))return sp('cm',t); return esc(t);});
  return out+(cm?sp('cm',cm):'');}
function hlTerm(s){const m=s.match(/^(\S+) (❯) (.*)$/);if(m)return sp('k',m[1])+' '+sp('y',m[2])+' '+esc(m[3]);return esc(s);}
function hl(s,o,after=''){const L=o.lang||'cpp';
  if(L==='cpp')return hlCpp(s,o,after);if(L==='toml')return hlToml(s);if(L==='asm')return hlAsm(s);if(L==='term')return hlTerm(s);return esc(s);}

const MK=/«([^|»]*)\|([^»]*)»/g;
function wrap(spec,inner,o,after){
  const [k,...a]=spec.split(':');
  switch(k){
    case 'cur': return '<span class="cur"></span>';
    case 'pin': return `<span class="pin">${a[0]}</span>`;
    case 'hint': return `<span class="hint">${esc(inner)}</span>`;
    case 'raw': return o.raw[a[0]];
    case 'c': return `<span class="call f" data-call="${a[0]}">${esc(inner)}</span>`;
    default:{const id=[k,...a].find(x=>x.startsWith('#'));const cls=[k,...a].filter(x=>!x.startsWith('#')).join(' ');
      return `<span class="${cls}"${id?` id="${id.slice(1)}"`:''}>${hl(inner,o,after)}</span>`;}
  }}
function line(s,o){let out='',last=0;const ms=[...s.matchAll(MK)];
  ms.forEach(m=>{const after=s.slice(m.index+m[0].length).replace(MK,'$2');
    out+=hl(s.slice(last,m.index),o,m[2]+after);out+=wrap(m[1],m[2],o,after);last=m.index+m[0].length;});
  return out+hl(s.slice(last),o,'');}
function code(src,o={}){
  const L=src.replace(/^\n/,'').replace(/\n\s*$/,'').split('\n');const st=o.start||1;
  return `<div class="code">`+L.map((s,i)=>{const n=st+i;const cls=['ln'];
    if(o.active===n)cls.push('act');
    if(o.dim&&!(n>=o.dim[0]&&n<=o.dim[1]))cls.push('dimmed');
    if(o.lcls&&o.lcls[n])cls.push(o.lcls[n]);
    const num=o.nums?o.nums[i]:n;
    const g=o.nog?'':`<span class="g">${o.gut&&o.gut[n]?o.gut[n]:''}${num}</span>`;
    return `<div class="${cls.join(' ')}" data-n="${n}">${g}<span class="t">${line(s,o)||' '}${o.eol&&o.eol[n]?o.eol[n]:''}</span></div>`;}).join('')+`</div>`;}
const eol=(cls,t,tag)=>`<span class="eol ${cls}">${esc(t)}${tag?`<span class="tag">${tag}</span>`:''}</span>`;

function tree(spec){return '<div class="tree">'+spec.replace(/^\n/,'').trimEnd().split('\n').map(l=>{
  const ind=l.match(/^ */)[0].length/2;const [name,...fl]=l.trim().split('|');const dir=name.endsWith('/');
  const fds=fl.filter(f=>f.startsWith('dot=')).map(f=>`<i class="fd" style="background:${f.slice(4)}"></i>`).join('');
  const cls=fl.filter(f=>!f.startsWith('dot=')&&!f.startsWith('note=')).join(' ');const nt=fl.find(f=>f.startsWith('note='));
  return `<div class="ti ${cls}" style="padding-left:${10+ind*13}px"><span class="ic">${dir?(cls.includes('open')?'▾':'▸'):''}</span><span class="nm">${esc(name)}</span>${nt?`<span class="dm" style="margin-left:8px;font-size:11px">${nt.slice(5)}</span>`:''}${fds?`<span class="fds">${fds}</span>`:''}</div>`;}).join('')+'</div>';}

function crumb(dir,file,fn,mod){return `<span class="crumb"><span class="dir">${dir}</span><span class="file">${file}</span>${mod?'<i class="mod"></i>':''}${fn?fn.map(f=>`<span class="sep">›</span><span class="fnn">${f}</span>`).join(''):''}</span>`;}
const RIGHT=(pos='45:42',w=0,e=0,extra='')=>`${extra}<span>${pos}</span><span class="ok">● clangd</span><span class="wa">⚠ ${w}</span><span class="er">✕ ${e}</span>`;
function win(o){
  const ctl=o.os==='win'?`<span class="wctl"><span>─</span><span>▢</span><span class="${o.hovx?'hov':''}">✕</span></span>`:o.os==='linux'?`<span class="wctl"><span class="${o.hovx?'hov':''}">✕</span></span>`:'';
  const dots=o.os==='win'||o.os==='linux'?'':`<span class="dots ${o.dotsOn?'on':''}"><i></i><i></i><i></i></span>`;
  return `<div class="win ${o.cls||''}" style="${o.style||''}">${o.nohdr?'':`<div class="hdr">${dots}${o.crumb}<span class="right">${o.right??RIGHT()}</span>${ctl}</div>`}
  <div class="body" style="grid-template-columns:${o.cols}">${o.panes.join('')}</div>
  ${o.term?`<div class="term" style="height:${o.termH||130}px">${o.term}</div>`:''}<svg class="links"></svg>${o.over||''}</div>`;}
const pane=(cls,inner,head)=>`<div class="pane ${cls}">${head?`<div class="ph">${head}</div>`:''}<div class="pbody">${inner}</div></div>`;
function card(name,loc,src,o={}){return `<div class="card ${o.focus?'focus':''} ${o.cls||''}" data-card="${o.id||name}" ${o.color?`data-color="${o.color}"`:''}>
  <div class="card-h"><span class="sw"></span><span class="nm">${o.title||name}</span>${o.badge||''}<span class="loc">${loc}</span></div>
  ${o.pre||''}${src?code(src,o.c||{}):''}${o.extra||''}</div>`;}
const cards=(...c)=>`<div class="cards">${c.join('')}</div>`;
const term=(tabs,src,o={})=>`<div class="tt">${tabs}</div><div style="padding:0 10px">${code(src,{lang:'term',nog:true,...o})}</div>`;
const TABS=(a='zsh',b='Problems 0')=>`<span class="on">${a}</span><span>${b}</span><span class="grow"></span><span>⌃\` toggle · drag edge to resize</span>`;
function frame(no,title,sub,stage,notes){return `<div class="frame"><div class="ttl"><span class="no">${no}</span><h1>${title}</h1><p>${sub}</p><span class="brand">MOSS · CONCEPT</span></div>
  <div class="stage">${stage}</div>${notes?`<div class="notes">${notes.map(([n,t])=>`<div class="note">${n?`<span class="pin">${n}</span>`:''}${t}</div>`).join('')}</div>`:''}</div>`;}

/* ---------- shared sample project ---------- */
const PAL=['#d8ba7b','#86b98a','#c8a8b8','#77a5a5','#d4a574','#d97969'];
const MAIN=R`void Server::start() {
    socket_.listen(port_);
    while (running_) {
        auto conn = socket_.accept();
        handle(conn);
    }
}

// Handles one client request end-to-end.
Response Server::handle(const Request& req) {«pin:2|»
    auto headers = «c:parse_headers|parse_headers»(req.raw);
    if (headers.empty()) {
        return Response::bad_request();
    }
    auto handler = «c:route|route»(req.path, routes_);
    Response res = handler(req, headers);«cur|»

const C_PARSE=R`Headers parse_headers(std::string_view raw) {
    Headers out;
    for (auto line : «c:split|split»(raw, "\r\n")) {
        auto colon = line.find(':');
        if (colon == npos) continue;
        out.emplace(«c:trim|trim»(line.substr(0, colon)),
                    «c:trim|trim»(line.substr(colon + 1)));«cur|»
    }
    return out;
}`;
const C_ROUTE=R`Handler route(sv path, const Routes& routes) {
    for (const auto& r : routes)
        if (match_path(r.pattern, path))
            return r.handler;
    return not_found;
}`;
const C_SEND=R`void send_response(Socket& s, const Response& r) {
    auto bytes = r.serialize();
    write_all(s, bytes.data(), bytes.size());
}`;
const C_SPLIT=R`Parts split(sv s, sv delim) {
    Parts out;
    size_t at = 0, nx;
    while ((nx = s.find(delim, at)) != npos) {
        out.push_back(s.substr(at, nx - at));
        at = nx + delim.size();
    }
    out.push_back(s.substr(at));
    return out;
}`;
const C_TRIM=R`sv trim(sv s) {
    while (!s.empty() && «c:is_space|is_space»(s.front()))
        s.remove_prefix(1);
    while (!s.empty() && «c:is_space|is_space»(s.back()))
        s.remove_suffix(1);«cur|»
    return s;
}`;

F['12-asm']=()=>{
  const SRC=R`#include <span>

// Sum of squares of v.
int sum_squares(std::span<const int> v) {
    int total = 0;«c:a2|»
    for (int x : v)«c:a3|»
        total += x * x;«c:a4|»
    return total;«c:a5|»
}`;
  const ASM=R`sum_squares(std::span<int const>):
        test    rsi, rsi        ; v.empty()
        je      .LBB0_1
        xor     eax, eax        ; total = 0
.LBB0_4:
        mov     ecx, dword ptr [rdi]
        imul    ecx, ecx        ; x * x
        add     eax, ecx        ; total +=
        add     rdi, 4          ; ++it
        dec     rsi
        jne     .LBB0_4
        ret                     ; return total
.LBB0_1:
        xor     eax, eax
        ret`;
  const after=root=>{const p=root.querySelector('.asmp');const set=(n,id,c)=>{const l=p.querySelector(`.ln[data-n="${n}"]`);l.dataset.card=id;l.dataset.color=c;};

function drawLinks(w){
  const svg=w.querySelector('svg.links');if(!svg)return;const wr=w.getBoundingClientRect();
  svg.setAttribute('width',wr.width);svg.setAttribute('height',wr.height);
  const colorOf={};let ci=0;
  w.querySelectorAll('[data-card]').forEach(c=>{const id=c.dataset.card;colorOf[id]=c.dataset.color||PAL[ci++%PAL.length];const sw=c.querySelector(':scope > .card-h .sw');if(sw)sw.style.background=colorOf[id];});
  let out='';
  w.querySelectorAll('.call[data-call]').forEach(el=>el.dataset.call.split(' ').forEach(id=>{
    const t=w.querySelector(`[data-card="${id}"]`);if(!t)return;const col=colorOf[id];
    const a=el.getBoundingClientRect(),pr=el.closest('.pane').getBoundingClientRect();
    const b=(t.querySelector(':scope > .card-h')||t.querySelector(':scope > .t')||t).getBoundingClientRect();
    // start after the end of the line's text so the lead never crosses code
    const rg=document.createRange();rg.selectNodeContents(el.closest('.t'));const tr=rg.getBoundingClientRect();
    const xe=pr.right-wr.left,y1=a.top+a.height/2-wr.top,x1=Math.min(Math.max(a.right-wr.left+2,tr.right-wr.left+8),xe),x2=b.left-wr.left+(t.classList.contains('ln')?4:0),y2=b.top+b.height/2-wr.top;
    if(el.textContent){el.style.textDecoration=`underline ${col}`;el.style.textUnderlineOffset='4px';el.style.textDecorationThickness='1.5px';}
    const k=Math.max(28,(x2-xe)*.55);
    if(xe-x1>2)out+=`<path d="M${x1} ${y1} L${xe} ${y1}" stroke="${col}" stroke-width="1.2" stroke-dasharray="2 4" opacity=".55" fill="none"/>`;
    out+=`<path d="M${xe} ${y1} C${xe+k} ${y1} ${x2-k} ${y2} ${x2} ${y2}" stroke="${col}" stroke-width="1.6" opacity=".9" fill="none"/>`;
    out+=`${xe-x1>2?`<circle cx="${x1}" cy="${y1}" r="2.6" fill="${col}"/>`:''}<circle cx="${x2}" cy="${y2}" r="3.2" fill="${col}"/>`;
  }));
  // analyzer step path
  const steps=[...w.querySelectorAll('.astep')];
  for(let i=1;i<steps.length;i++){const p=steps[i-1].getBoundingClientRect(),q=steps[i].getBoundingClientRect();
    const x1=p.left-wr.left+p.width/2,y1=p.bottom-wr.top,x2=q.left-wr.left+q.width/2,y2=q.top-wr.top;const c=i===steps.length-1?'#d97969':'#d4a574';
    out+=`<path d="M${x1} ${y1} C${x1} ${y1+24} ${x2} ${y2-24} ${x2} ${y2}" stroke="${c}" stroke-width="1.5" stroke-dasharray="4 3" fill="none" opacity=".85"/>`;}
  svg.innerHTML=out;}
function placePops(w){const wr=w.getBoundingClientRect();
  w.querySelectorAll('.pop[data-at]').forEach(p=>{const a=document.getElementById(p.dataset.at);if(!a)return;const r=a.getBoundingClientRect();
    const dx=+(p.dataset.dx||0),dy=+(p.dataset.dy||0);p.style.left=(r.left-wr.left+dx)+'px';
    p.style.top=(p.dataset.side==='above'?r.top-wr.top-p.offsetHeight+dy+50:r.bottom-wr.top+dy)+'px';});
  const rul=w.querySelector('#rul');if(rul){const code=w.querySelector('.pane');const cr=code.getBoundingClientRect();rul.style.left=(cr.right-wr.left-9)+'px';rul.style.top=(cr.top-wr.top)+'px';rul.style.height=cr.height+'px';rul.style.bottom='auto';
    const ticks=[...code.querySelectorAll('.eol')].map(e=>{const r=e.getBoundingClientRect();const c=e.classList.contains('er')?'#d97969':e.classList.contains('wa')?'#d4a574':'#77a5a5';return `<i style="top:${(r.top-cr.top)+6}px;background:${c}"></i>`;});rul.innerHTML=ticks.join('');}}
