# Builds the Windows and Linux versions on real machines, checks each packaged app starts and works,
# and attaches them to the GitHub Release of the tag. (The macOS version is built on a Mac with `npm run package`.)
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'attach the builds to this existing tag''s release (empty: build and check only)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, name: win-x64 }
          - { os: ubuntu-22.04, name: linux-x64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Electron for this system
        run: node node_modules/electron/install.js

      - name: Icon tool (Windows, for this build only)
        if: runner.os == 'Windows'
        run: npm install --no-save rcedit@5.0.2

      - name: Inbuilt clangd, checked against its pinned SHA-256
        run: npm run fetch-clangd

      - name: Tests
        continue-on-error: true   # written on macOS; failures here are reported, the packaged app is what must pass
        run: npm test

      - name: Package
        run: npm run package

      - name: Boot check (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq xvfb libgtk-3-0 libnss3 libxss1 libgbm1 libasound2
          dir=$(ls -d release/SkyCodeX-*-linux-x64)
          timeout 360 xvfb-run -a "$dir/skycodex" --smoke "$PWD/samples/tinyhttp" --scenario boot || true
          node src/build/check-smoke.mjs "$dir"

      # as the README tells Windows users: the C/C++ standard headers come from the llvm-mingw pack. Installed the way
      # the app installs it (src/main/packs.ts): the official release, its published SHA-256 checked, unpacked into
      # language_packs/<name>-<version> beside the app with its skycodex-pack.json
      - name: llvm-mingw pack (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = (Get-ChildItem release -Directory | Select-Object -First 1).FullName
          $rels = gh api 'repos/mstorsjo/llvm-mingw/releases?per_page=20' | ConvertFrom-Json
          $asset = $null
          foreach ($r in $rels) {
            if ($r.prerelease -or $r.draft) { continue }
            $asset = $r.assets | Where-Object { $_.name -match '^llvm-mingw-(\d{8})-ucrt-x86_64\.zip$' -and $_.digest -match '^sha256:[0-9a-f]{64}$' } | Select-Object -First 1
            if ($asset) { break }
          }
          if (-not $asset) { throw 'no llvm-mingw release with a published checksum' }
          $version = [regex]::Match($asset.name, '\d{8}').Value
          $zip = Join-Path $env:RUNNER_TEMP $asset.name
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ("sha256:$sha" -ne $asset.digest) { throw "checksum mismatch for $($asset.name)" }
          $tmp = Join-Path $env:RUNNER_TEMP 'llvm-mingw'
          Expand-Archive $zip -DestinationPath $tmp
          $top = (Get-ChildItem $tmp -Directory | Select-Object -First 1).FullName
          $packs = Join-Path $dir 'language_packs'
          New-Item -ItemType Directory -Force $packs | Out-Null
          $id = "llvm-mingw-$version"
          Move-Item $top (Join-Path $packs $id)
          @{ id = $id; kind = 'toolchain'; name = 'llvm-mingw'; version = $version; bin = 'bin'; source = 'github.com/mstorsjo/llvm-mingw';
             asset = $asset.name; sha256 = $sha; bytes = 0; installedAt = (Get-Date).ToUniversalTime().ToString('o') } |
            ConvertTo-Json | Set-Content (Join-Path $packs $id 'skycodex-pack.json') -Encoding utf8
          Write-Host "installed $id into $packs"

      - name: Boot check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = (Get-ChildItem release -Directory | Select-Object -First 1).FullName
          # wait for the app itself only (with -Wait, Start-Process also waits for every process it started), at most 6 minutes
          $p = Start-Process -FilePath "$dir\SkyCodeX.exe" -ArgumentList '--smoke', "`"$PWD\samples\tinyhttp`"", '--scenario', 'boot' -PassThru
          if (-not $p.WaitForExit(360000)) { Stop-Process -Id $p.Id -Force; Write-Host 'the app did not finish in 6 minutes' }
          Get-Process clangd, SkyCodeX -ErrorAction SilentlyContinue | Format-Table Id, Name
          node src/build/check-smoke.mjs "$dir"

      - name: Screenshot and logs of the check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.name }}
          path: release/*/data/logs/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            release/*.zip
            release/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: '*-x64'
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ls -la out
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "SkyCodeX ${TAG#v}" --notes "Portable builds for each system."
          # the archives only; the artifacts also hold the unpacked folders
          gh release upload "$TAG" out/*.zip out/*.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
